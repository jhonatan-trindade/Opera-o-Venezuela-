<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    .flatpickr-calendar { z-index: 9999 !important; }
    body { color: #e0e0e0; font-family: 'Segoe UI', sans-serif; background-color: #121212; }

    body.fundo-interno {
      background-image: none !important;
      background-color: #121212 !important;
    }

    .card-op { background-color: rgba(26,26,26,0.9); border: 1px solid #333; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; height: 100%; position: relative; overflow: hidden; }
    .card-op::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #333; transition: 0.3s ease; }
    .card-op:hover { border-color: #0d6efd; transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,0,0,0.6); }
    .card-op:hover::before { background: #0d6efd; }

    .view-container { display: none; padding: 20px; }

    .header-op { background: transparent; padding: 0 0 10px 0; border-bottom: 1px solid #333; margin-bottom: 15px; }
    .header-op h5 { margin: 0; color: #fff; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }

    .nav-tabs { background: transparent; border-bottom: 1px solid #333; gap: 4px; padding-left: 0; margin-top: 0; position: relative; z-index: 10; }
    .nav-tabs .nav-link { color: #888; border: 1px solid transparent; padding: 8px 16px; font-weight: 700; font-size: 0.75rem; border-radius: 4px 4px 0 0; background: transparent; cursor: pointer; transition: all 0.2s ease; margin-bottom: -1px; text-transform: uppercase; letter-spacing: 0.5px; }
    .nav-tabs .nav-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-tabs .nav-link.active { background: #1a1a1a; border-color: #333 #333 transparent; border-bottom: 2px solid #1a1a1a; color: #0d6efd; font-weight: 800; }

    .tab-content { background: #1a1a1a; padding: 15px; min-height: 80vh; border: 1px solid #333; border-top: none; }

    #filtroChamada, #filtroDataInicio, #filtroDataFim, #filtroStatus { color: #ffffff !important; }
    ::placeholder { color: #bbbbbb !important; opacity: 1; }
    .ts-control, .ts-wrapper.single .ts-control, .ts-control input { color: #ffffff !important; background-color: #212529 !important; border-color: #444 !important; }
    .ts-dropdown, .ts-dropdown .option { background-color: #212529 !important; color: #ffffff !important; border-color: #444 !important; }
    .ts-dropdown .option.active, .ts-dropdown .option:hover { background-color: #343a40 !important; color: #ffffff !important; }
    label.form-label, .form-label.text-muted { color: #ffffff !important; }

    #viewInterna { padding-left: 10px !important; padding-right: 10px !important; }
    #tituloOperacao { font-size: 1.15rem !important; letter-spacing: 0.5px; }
    .header-op { margin-bottom: 5px !important; padding-bottom: 5px !important; }
    #conteudoAbas { padding: 12px 10px !important; min-height: 75vh; }

    /* HUB */
    #viewHub { min-height: 90vh; display: flex; align-items: center; justify-content: center; }
    .hub-card { background: linear-gradient(160deg, #1a1a1a 0%, #101418 100%); border: 1px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 3rem; text-align: center; max-width: 560px; width: 100%; }
    .hub-badge { letter-spacing: 2px; color: #0dcaf0; font-weight: 800; font-size: 0.8rem; }
    .hub-metric { background-color: #151515; border: 1px solid #333; border-radius: 8px; padding: 1rem; }
    .hub-metric .num { font-size: 2rem; font-weight: 800; line-height: 1; }
  </style>
</head>
<body class="text-white">

  <!-- ==================== HUB (TELA INICIAL) ==================== -->
  <div id="viewHub">
    <div class="hub-card">
      <div class="hub-badge mb-2"><i class="bi bi-broadcast-pin"></i> SISTEMA DE COMANDO EM OPERAÇÕES · SCO 201/202</div>
      <h1 class="text-white text-uppercase mb-2" style="font-weight:800;letter-spacing:1px;">Plataforma de Gestão de Incidentes</h1>
      <p class="text-secondary mb-4">Registro de ações, vítimas e efetivo — captura simples e rápida em campo para gestão da ocorrência e produção de documentos pós-operação.</p>
      <div class="row g-3 justify-content-center mb-4">
        <div class="col-5">
          <div class="hub-metric">
            <div class="num text-success" id="globalAndamento">0</div>
            <div class="small text-uppercase text-secondary fw-bold mt-1">Em andamento</div>
          </div>
        </div>
        <div class="col-5">
          <div class="hub-metric">
            <div class="num text-secondary" id="globalConcluidas">0</div>
            <div class="small text-uppercase text-secondary fw-bold mt-1">Concluídas</div>
          </div>
        </div>
      </div>
      <button class="btn btn-info text-dark fw-bold shadow w-100" style="font-size:1.1rem;padding:12px;" onclick="entrarOperacoes()">
        <i class="bi bi-box-arrow-in-right"></i> ACESSAR OPERAÇÕES
      </button>
    </div>
  </div>

  <!-- ==================== LISTA DE OPERAÇÕES ==================== -->
  <div class="container mt-4 view-container" id="viewOperacoes">

    <div class="mb-3 d-flex justify-content-between align-items-center">
      <button class="btn btn-outline-secondary text-white btn-sm" onclick="voltarAoHub()">
        <i class="bi bi-arrow-left"></i> INÍCIO
      </button>
      <button class="btn btn-success fw-bold" onclick="abrirModalNovaOp()">
        <i class="bi bi-plus-lg"></i> Nova Operação
      </button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
      <h3 class="fw-bold text-white m-0 text-uppercase" id="tituloPainelCob">OPERAÇÕES</h3>
    </div>

    <div class="card card-body bg-dark border-secondary p-3 text-white shadow-sm mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-md-2">
          <label for="filtroStatus" class="form-label small text-muted text-uppercase fw-bold mb-1">Status</label>
          <select id="filtroStatus" class="form-select bg-dark text-white border-secondary">
            <option value="Todas">Todas</option>
            <option value="Em Andamento" selected>Em Andamento</option>
            <option value="Concluída">Concluída</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="filtroMunicipio" class="form-label small text-muted text-uppercase fw-bold mb-1">Município</label>
          <select id="filtroMunicipio" class="form-select bg-dark text-white border-secondary">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="filtroChamada" class="form-label small text-muted text-uppercase fw-bold mb-1">Nº Chamada</label>
          <input type="text" id="filtroChamada" class="form-control bg-dark text-white border-secondary" placeholder="Ex: 12345">
        </div>
        <div class="col-md-4">
          <label class="form-label small text-muted text-uppercase fw-bold mb-1">Período (Início / Fim)</label>
          <div class="input-group">
            <input type="text" id="filtroDataInicio" class="form-control bg-dark text-white border-secondary" placeholder="A partir de">
            <input type="text" id="filtroDataFim" class="form-control bg-dark text-white border-secondary" placeholder="Até">
          </div>
        </div>
        <div class="col-md-1">
          <button id="btnLimparFiltros" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center" title="Limpar Filtros" style="height:38px;">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="row g-4" id="gridCartoes"></div>
  </div>

  <!-- ==================== PAINEL INTERNO DA OPERAÇÃO ==================== -->
  <div class="container-fluid mt-2 px-4 view-container" id="viewInterna">
    <div class="header-op d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-secondary btn-sm me-3 d-flex align-items-center justify-content-center text-white" title="Voltar" onclick="voltarParaOperacoes()" style="width:40px;height:38px;border-color:#555;">
          <i class="bi bi-arrow-left fs-5"></i>
        </button>
        <h3 id="tituloOperacao" class="m-0 text-white fw-bold">---</h3>
      </div>
    </div>

    <input type="hidden" id="idOpAtiva" value="">

    <ul class="nav nav-tabs" id="abasOperacao" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active fw-bold" id="sco-tab" data-bs-toggle="tab" data-bs-target="#sco" type="button" role="tab" style="color:#0dcaf0 !important;">
          <i class="bi bi-journal-text"></i> Formulários SCO
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="vitimas-tab" data-bs-toggle="tab" data-bs-target="#vitimas" type="button" role="tab">
          <i class="bi bi-person-vcard"></i> REGISTRO DE VÍTIMAS
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="efetivo-tab" data-bs-toggle="tab" data-bs-target="#efetivo" type="button" role="tab">
          CADASTRO DE EFETIVO
        </button>
      </li>
    </ul>

    <div class="tab-content p-4 shadow" id="conteudoAbas">
      <div class="tab-pane fade show active" id="sco" role="tabpanel"><?!= include('SCO'); ?></div>
      <div class="tab-pane fade" id="vitimas" role="tabpanel"><?!= include('Vitimas'); ?></div>
      <div class="tab-pane fade" id="efetivo" role="tabpanel"><?!= include('efetivo'); ?></div>
    </div>
  </div>

  <!-- ==================== MODAL NOVA / EDITAR OPERAÇÃO ==================== -->
  <div class="modal fade" id="modalNovaOperacao" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="max-width:80%;">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold text-uppercase"><i class="bi bi-plus-circle text-success"></i> Nova Operação</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNovaOperacao">
            <input type="hidden" id="novaOp_id">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label text-warning small fw-bold">NOME DA OPERAÇÃO</label>
                <input type="text" class="form-control bg-black text-white border-secondary" id="novaOp_nome" placeholder="Ex: Busca Ouro Preto" required>
              </div>
              <div class="col-md-4">
                <label class="form-label text-warning small fw-bold">COMANDO</label>
                <input type="text" class="form-control bg-secondary text-white border-secondary" id="novaOp_cob" readonly>
              </div>
              <div class="col-md-8">
                <label class="form-label text-warning small fw-bold">MUNICÍPIO(S)</label>
                <select id="novaOp_municipio" class="form-control bg-black text-white border-secondary" multiple placeholder="Digite ou selecione os municípios..."></select>
              </div>
              <div class="col-md-4">
                <label class="form-label text-warning small fw-bold">Nº CHAMADA</label>
                <input type="text" class="form-control bg-black text-white border-secondary" id="novaOp_chamada" placeholder="2026-12345678-0" oninput="mascaraChamada(this)" maxlength="15">
              </div>
              <div class="col-md-8">
                <label class="form-label text-warning small fw-bold">COMANDANTE (CMT)</label>
                <input type="text" class="form-control bg-black text-white border-secondary" id="novaOp_cmt" placeholder="Posto/Graduação e Nome">
              </div>
              <div class="col-md-4">
                <label class="form-label text-warning small fw-bold">STATUS</label>
                <select class="form-select bg-black text-white border-secondary" id="novaOp_status" onchange="calcularTermino()">
                  <option value="Em Andamento" selected>Em Andamento</option>
                  <option value="Concluída">Concluída</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label text-warning small fw-bold">UNIDADE DE CONSERVAÇÃO (UC) - Opcional</label>
                <select id="novaOp_uc" class="form-control bg-black text-white border-secondary" placeholder="Selecione a UC (se aplicável)...">
                  <option value="">Nenhuma / Não se aplica</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-warning small fw-bold">DATA / HORA INÍCIO</label>
                <input type="text" class="form-control bg-black text-white border-secondary" id="novaOp_inicio" placeholder="Selecione a data e hora" required>
              </div>
              <div class="col-md-6">
                <label class="form-label text-warning small fw-bold">DATA / HORA TÉRMINO</label>
                <input type="text" class="form-control bg-secondary text-white border-secondary" id="novaOp_termino" placeholder="Automático ao Concluir" readonly>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success fw-bold" id="btnSalvarOp" onclick="salvarNovaOperacao()"><i class="bi bi-save"></i> Gravar Operação</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    let cobAtivo = "GERAL";
    let operacoesGlobais = [];

    // ==========================================
    // NAVEGAÇÃO PRINCIPAL
    // ==========================================
    function entrarOperacoes() {
      cobAtivo = "GERAL";
      document.getElementById('viewHub').style.display = 'none';
      document.getElementById('viewInterna').style.display = 'none';
      document.getElementById('viewOperacoes').style.display = 'block';
      document.getElementById('tituloPainelCob').innerText = 'OPERAÇÕES';
      document.getElementById('gridCartoes').innerHTML = '<div class="col-12 text-center text-warning mt-5"><div class="spinner-border" role="status"></div><h5 class="mt-3 text-secondary">Buscando operações...</h5></div>';

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(listaReal) {
            operacoesGlobais = listaReal || [];
            inicializarFiltrosOp(operacoesGlobais);
          })
          .withFailureHandler(function() {
            document.getElementById('gridCartoes').innerHTML = '<div class="col-12 text-center text-danger mt-5"><h5>Erro ao buscar operações.</h5></div>';
          })
          .getOperacoes();
      } else {
        operacoesGlobais = [{ id: 1, nome: "OP RESGATE VENEZUELA", cob: "GERAL", municipio: "Caracas", inicio: "01/07/2026 08:00", termino: "-", comandante: "Cmt Incidente", status: "Em Andamento" }];
        inicializarFiltrosOp(operacoesGlobais);
      }
    }

    function voltarAoHub() {
      document.getElementById('viewOperacoes').style.display = 'none';
      document.getElementById('viewInterna').style.display = 'none';
      document.getElementById('viewHub').style.display = 'flex';
      atualizarContadoresMapa();
    }

    function abrirOperacao(id, nome) {
      document.body.classList.add('fundo-interno');
      const opSelecionada = operacoesGlobais.find(o => String(o.id) === String(id));

      let tituloHTML = nome;
      if (opSelecionada) {
        let duracao = calcularDuracao(opSelecionada.inicio, opSelecionada.termino, opSelecionada.status);
        if (duracao) tituloHTML += ` <span class="text-warning">(${duracao})</span>`;
        if (opSelecionada.uc && opSelecionada.uc.trim() !== '' && opSelecionada.uc !== "Nenhuma / Não se aplica") {
          tituloHTML += ` <span class="text-info" style="font-size:1rem;font-weight:600;">- ${opSelecionada.uc}</span>`;
        }
      }

      document.getElementById('viewHub').style.display = 'none';
      document.getElementById('viewOperacoes').style.display = 'none';
      document.getElementById('viewInterna').style.display = 'block';
      document.getElementById('tituloOperacao').innerHTML = tituloHTML;
      document.getElementById('idOpAtiva').value = id;

      window.dispatchEvent(new CustomEvent('operacaoAberta', { detail: { idOp: id } }));
      if (typeof recarregarSCO === 'function') recarregarSCO();
    }

    function voltarParaOperacoes() {
      document.body.classList.remove('fundo-interno');
      entrarOperacoes();
    }

    // ==========================================
    // RENDERIZAÇÃO DOS CARDS
    // ==========================================
    function renderizarCartoes(lista) {
      const container = document.getElementById('gridCartoes');
      container.innerHTML = '';
      if (lista.length === 0) {
        container.innerHTML = '<div class="col-12 text-center text-secondary mt-4"><h5>Nenhuma operação encontrada.</h5></div>';
        return;
      }
      lista.forEach(op => {
        let corBadge = op.status === 'Em Andamento' ? 'bg-success' : 'bg-danger';
        let corBorda = op.status === 'Em Andamento' ? 'border-success' : 'border-danger';
        let textoLocal = op.municipio;
        if (op.uc && op.uc.trim() !== '' && op.uc !== 'Nenhuma / Não se aplica') textoLocal += ` - ${op.uc}`;

        let duracaoExibicao = op.status === 'Em Andamento'
          ? calcularDuracao(op.inicio, op.termino, op.status)
          : op.duracao;

        container.innerHTML += `
          <div class="col-12 col-md-6 col-xl-4">
            <div class="card bg-dark text-light border ${corBorda} h-100 card-op" style="border-width:2px!important;box-shadow:0 4px 8px rgba(0,0,0,0.3);">
              <div class="card-body">
                <div class="mb-3"><span class="badge ${corBadge} text-uppercase px-2 py-1">${op.status}</span></div>
                <h5 class="card-title fw-bold text-uppercase mb-1">${op.nome}</h5>
                <p class="text-info small mb-3"><i class="bi bi-geo-alt-fill"></i> ${textoLocal}</p>
                <div class="small" style="color:#bbb;">
                  <div class="d-flex justify-content-between border-bottom border-secondary pb-1 mb-1">
                    <span><i class="bi bi-calendar-event"></i> Início:</span> <span class="text-white">${op.inicio}</span>
                  </div>
                  <div class="d-flex justify-content-between border-bottom border-secondary pb-1 mb-1">
                    <span><i class="bi bi-calendar-check"></i> Término:</span> <span class="text-white">${op.termino}</span>
                  </div>
                  <div class="d-flex justify-content-between border-bottom border-secondary pb-1 mb-1">
                    <span><i class="bi bi-clock-history"></i> Duração:</span> <span class="text-warning fw-bold">${duracaoExibicao}</span>
                  </div>
                  <div class="d-flex justify-content-between pt-1 mb-2">
                    <span><i class="bi bi-person-badge"></i> Comandante:</span> <span class="text-warning fw-bold">${op.comandante}</span>
                  </div>
                </div>
                <div class="mt-2 pt-2 border-top border-secondary">
                  <div class="text-secondary small fw-bold mb-1" style="font-size:0.70rem;">RESUMO RECURSOS:</div>
                  <div class="d-flex justify-content-between text-white small">
                    <span><i class="bi bi-people-fill text-info"></i> EFETIVO: <strong class="fs-6 text-light">${op.efetivo || 0}</strong></span>
                    <span><i class="bi bi-truck text-info"></i> VTRS: <strong class="fs-6 text-light">${op.vtrs || 0}</strong></span>
                  </div>
                </div>
              </div>
              <div class="card-footer bg-transparent border-0 pt-0 d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm flex-grow-0" title="Editar" onclick="abrirModalEditarOp('${op.id}')"><i class="bi bi-pencil-square"></i></button>
                <button class="btn btn-success btn-sm flex-grow-1 fw-bold" onclick="abrirOperacao('${op.id}', '${op.nome}')">Acessar Painel <i class="bi bi-arrow-right-circle ms-1"></i></button>
              </div>
            </div>
          </div>`;
      });
    }

    // ==========================================
    // FILTROS
    // ==========================================
    let fpFiltroInicio, fpFiltroFim, tomSelectFiltroMunicipio;

    function inicializarFiltrosOp(lista) {
      if (!fpFiltroInicio) {
        fpFiltroInicio = flatpickr("#filtroDataInicio", { locale: "pt", dateFormat: "d/m/Y", onChange: filtrarCards });
        fpFiltroFim    = flatpickr("#filtroDataFim",    { locale: "pt", dateFormat: "d/m/Y", onChange: filtrarCards });
      }
      const selectMun = document.getElementById('filtroMunicipio');
      selectMun.innerHTML = '<option value="">Todos</option>';
      [...new Set(lista.map(op => op.municipio).filter(Boolean))].sort().forEach(mun => {
        mun.split(',').map(m => m.trim()).forEach(p => {
          if (p && !selectMun.querySelector(`option[value="${p}"]`)) {
            let opt = document.createElement('option'); opt.value = p; opt.textContent = p;
            selectMun.appendChild(opt);
          }
        });
      });
      if (tomSelectFiltroMunicipio) tomSelectFiltroMunicipio.destroy();
      tomSelectFiltroMunicipio = new TomSelect("#filtroMunicipio", { create: false, sortField: { field: "text", direction: "asc" }, onChange: filtrarCards });
      document.getElementById('filtroStatus').addEventListener('change', filtrarCards);
      document.getElementById('filtroChamada').addEventListener('input', filtrarCards);
      document.getElementById('btnLimparFiltros').addEventListener('click', limparFiltrosListagem);
      limparFiltrosListagem();
    }

    function filtrarCards() {
      const statusVal   = document.getElementById('filtroStatus').value;
      const municipioVal = document.getElementById('filtroMunicipio').value;
      const chamadaVal  = document.getElementById('filtroChamada').value.toLowerCase().trim();
      const dataIniVal  = document.getElementById('filtroDataInicio').value;
      const dataFimVal  = document.getElementById('filtroDataFim').value;

      renderizarCartoes(operacoesGlobais.filter(op => {
        if ((statusVal !== 'Todas') && op.status !== statusVal) return false;
        if (municipioVal && !(op.municipio && op.municipio.includes(municipioVal))) return false;
        if (chamadaVal && !(op.chamada && op.chamada.toLowerCase().includes(chamadaVal))) return false;
        if (dataIniVal || dataFimVal) {
          if (!op.inicio || op.inicio === "-") return false;
          const p = op.inicio.split(' ')[0].split('/');
          if (p.length === 3) {
            const dataOp = new Date(p[2], p[1]-1, p[0]);
            if (dataIniVal) { const i = dataIniVal.split('/'); if (dataOp < new Date(i[2],i[1]-1,i[0])) return false; }
            if (dataFimVal) { const f = dataFimVal.split('/'); if (dataOp > new Date(f[2],f[1]-1,f[0])) return false; }
          }
        }
        return true;
      }));
    }

    function limparFiltrosListagem() {
      document.getElementById('filtroStatus').value = "Em Andamento";
      document.getElementById('filtroChamada').value = "";
      if (fpFiltroInicio) fpFiltroInicio.clear();
      if (fpFiltroFim) fpFiltroFim.clear();
      if (tomSelectFiltroMunicipio) tomSelectFiltroMunicipio.setValue("");
      filtrarCards();
    }

    // ==========================================
    // MODAL NOVA / EDITAR OPERAÇÃO
    // ==========================================
    let tomSelectMunicipios = null, tomSelectUC = null;

    function mascaraChamada(obj) {
      let v = obj.value.replace(/\D/g, '');
      if (v.length > 13) v = v.substring(0, 13);
      if (v.length > 12)     v = v.replace(/^(\d{4})(\d{8})(\d{1})/, "$1-$2-$3");
      else if (v.length > 4) v = v.replace(/^(\d{4})(\d+)/, "$1-$2");
      obj.value = v;
    }

    document.addEventListener("DOMContentLoaded", function() {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(preencherMunicipios).getMunicipiosMG();
        google.script.run.withSuccessHandler(preencherUCs).getUCs();
      }
      atualizarContadoresMapa();
    });

    function preencherMunicipios(lista) {
      const s = document.getElementById('novaOp_municipio');
      lista.forEach(mun => { let o = document.createElement('option'); o.value = mun; o.text = mun; s.appendChild(o); });
      tomSelectMunicipios = new TomSelect("#novaOp_municipio", { plugins: ['remove_button'], create: false, sortField: { field: "text", direction: "asc" } });
    }

    function preencherUCs(lista) {
      const s = document.getElementById('novaOp_uc');
      lista.forEach(uc => { let o = document.createElement('option'); o.value = uc; o.text = uc; s.appendChild(o); });
      tomSelectUC = new TomSelect("#novaOp_uc", { create: false, sortField: { field: "text", direction: "asc" }, maxItems: 1 });
    }

    function abrirModalNovaOp() {
      document.querySelector('#modalNovaOperacao .modal-title').innerHTML = '<i class="bi bi-plus-circle text-success"></i> Nova Operação';
      document.getElementById('formNovaOperacao').reset();
      document.getElementById('novaOp_id').value = "OP-" + new Date().getTime();
      document.getElementById('novaOp_cob').value = cobAtivo;
      document.getElementById('novaOp_termino').value = "";
      if (tomSelectMunicipios) tomSelectMunicipios.clear();
      if (tomSelectUC) tomSelectUC.clear();
      const modalEl = document.getElementById('modalNovaOperacao');
      document.body.appendChild(modalEl);
      const inp = document.getElementById('novaOp_inicio');
      if (inp._flatpickr) inp._flatpickr.destroy();
      flatpickr(inp, { enableTime: true, dateFormat: "d/m/Y H:i", locale: "pt", time_24hr: true, static: true });
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    }

    function abrirModalEditarOp(idOp) {
      const op = operacoesGlobais.find(o => String(o.id) === String(idOp));
      if (!op) return;
      document.querySelector('#modalNovaOperacao .modal-title').innerHTML = '<i class="bi bi-pencil-square text-primary"></i> Editar Operação';
      document.getElementById('novaOp_id').value = op.id;
      document.getElementById('novaOp_nome').value = op.nome;
      document.getElementById('novaOp_cob').value = op.cob;
      document.getElementById('novaOp_chamada').value = op.chamada;
      document.getElementById('novaOp_cmt').value = op.comandante !== "Não Informado" ? op.comandante : "";
      document.getElementById('novaOp_status').value = op.status;
      document.getElementById('novaOp_termino').value = op.termino !== "-" ? op.termino : "";
      const modalEl = document.getElementById('modalNovaOperacao');
      document.body.appendChild(modalEl);
      const inp = document.getElementById('novaOp_inicio');
      if (inp._flatpickr) inp._flatpickr.destroy();
      flatpickr(inp, { enableTime: true, dateFormat: "d/m/Y H:i", locale: "pt", time_24hr: true, static: true });
      inp._flatpickr.setDate(op.inicio, true, "d/m/Y H:i");
      if (tomSelectMunicipios) {
        tomSelectMunicipios.clear();
        if (op.municipio) op.municipio.split(',').map(m => m.trim()).forEach(m => tomSelectMunicipios.addItem(m));
      }
      if (tomSelectUC) {
        tomSelectUC.clear();
        if (op.uc && op.uc !== 'Nenhuma / Não se aplica') tomSelectUC.addItem(op.uc);
      }
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    }

    function calcularTermino() {
      const status = document.getElementById('novaOp_status').value;
      const campo  = document.getElementById('novaOp_termino');
      if (status === 'Concluída') {
        const agora = new Date();
        campo.value = `${String(agora.getDate()).padStart(2,'0')}/${String(agora.getMonth()+1).padStart(2,'0')}/${agora.getFullYear()} ${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
      } else {
        campo.value = '';
      }
    }

    function salvarNovaOperacao() {
      const btnSalvar = document.getElementById('btnSalvarOp');
      const dados = {
        id:        document.getElementById('novaOp_id').value,
        nome:      document.getElementById('novaOp_nome').value.toUpperCase(),
        cob:       document.getElementById('novaOp_cob').value,
        municipios: tomSelectMunicipios ? tomSelectMunicipios.getValue().join(', ') : '',
        chamada:   document.getElementById('novaOp_chamada').value,
        cmt:       document.getElementById('novaOp_cmt').value.toUpperCase(),
        uc:        tomSelectUC ? tomSelectUC.getValue() : '',
        status:    document.getElementById('novaOp_status').value,
        inicio:    document.getElementById('novaOp_inicio').value,
        termino:   document.getElementById('novaOp_termino').value,
        duracao:   calcularDuracao(document.getElementById('novaOp_inicio').value, document.getElementById('novaOp_termino').value, document.getElementById('novaOp_status').value)
      };
      if (!dados.nome || !dados.inicio || !dados.municipios) {
        Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Preencha o Nome, os Municípios e a Data de Início!', background: '#1a1a1a', color: '#fff', confirmButtonColor: '#ff9800' });
        return;
      }
      btnSalvar.disabled = true;
      btnSalvar.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Gravando...';
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(() => {
          btnSalvar.disabled = false;
          btnSalvar.innerHTML = '<i class="bi bi-save"></i> Gravar Operação';
          bootstrap.Modal.getOrCreateInstance(document.getElementById('modalNovaOperacao')).hide();
          Swal.fire({ icon: 'success', title: 'Sucesso', text: 'Operação salva com sucesso.', background: '#1a1a1a', color: '#fff', showConfirmButton: false, timer: 2000 });
          entrarOperacoes();
        }).salvarOperacaoPlanilha(dados);
      }
    }

    function calcularDuracao(inicioStr, terminoStr, status) {
      if (!inicioStr) return "";
      const parseData = (str) => {
        if (!str || str === "-") return new Date();
        const p = str.split(" ")[0].split("/");
        return new Date(p[2], p[1]-1, p[0]);
      };
      const dInicio = parseData(inicioStr); dInicio.setHours(0,0,0,0);
      let dFim = new Date(); dFim.setHours(0,0,0,0);
      if (status === 'Concluída' && terminoStr && terminoStr !== "-") {
        dFim = parseData(terminoStr); dFim.setHours(0,0,0,0);
      }
      const diff = Math.floor((dFim - dInicio) / (1000*3600*24));
      return "DIA " + (diff >= 0 ? diff + 1 : 1);
    }

    // ==========================================
    // CONTADORES DO HUB
    // ==========================================
    function atualizarContadoresMapa() {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(function(lista) {
          let andamento = 0, concluidas = 0;
          lista.forEach(op => {
            if (op.status === 'Em Andamento') andamento++;
            else if (op.status === 'Concluída') concluidas++;
          });
          const ea = document.getElementById('globalAndamento');
          const ec = document.getElementById('globalConcluidas');
          if (ea) ea.innerText = andamento;
          if (ec) ec.innerText = concluidas;
        }).getOperacoes();
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      const scoTabBtn = document.getElementById('sco-tab');
      if (scoTabBtn) {
        scoTabBtn.addEventListener('shown.bs.tab', function () {
          const id = document.getElementById('idOpAtiva') ? document.getElementById('idOpAtiva').value : null;
          if (id && typeof recarregarSCO === 'function') recarregarSCO();
        });
      }
    });

  </script>
</body>
