<style>
  #viewHub { min-height: 82vh; }
  .hub-hero {
    background: linear-gradient(160deg, #1a1a1a 0%, #101418 100%);
    border: 1px solid #333; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .hub-badge { letter-spacing: 2px; color: #0dcaf0; font-weight: 800; font-size: 0.8rem; }
  .hub-title { font-weight: 800; letter-spacing: 1px; }
  .hub-metric { background-color: #151515; border: 1px solid #333; border-radius: 8px; }
  .hub-metric .num { font-size: 2rem; font-weight: 800; line-height: 1; }
  .btn-hub-entrar { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; padding: 12px 34px; }
</style>

<div class="container view-container" id="viewHub" style="display: block;">
  <div class="row justify-content-center align-items-center" style="min-height: 82vh;">
    <div class="col-12 col-lg-9">
      <div class="hub-hero p-4 p-md-5 text-center">

        <div class="hub-badge mb-2"><i class="bi bi-broadcast-pin"></i> SISTEMA DE COMANDO EM OPERAÇÕES · SCO 201/202</div>
        <h1 class="hub-title text-white text-uppercase mb-2">Plataforma de Gestão de Incidentes</h1>
        <p class="text-secondary mb-4">Registro de ações, vítimas e efetivo — captura simples e rápida em campo para gestão da ocorrência e produção de documentos pós-operação.</p>

        <div class="row g-3 justify-content-center mb-4">
          <div class="col-6 col-md-4">
            <div class="hub-metric p-3">
              <div class="num text-success" id="globalAndamento">0</div>
              <div class="small text-uppercase text-secondary fw-bold mt-1">Em andamento</div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="hub-metric p-3">
              <div class="num text-secondary" id="globalConcluidas">0</div>
              <div class="small text-uppercase text-secondary fw-bold mt-1">Concluídas</div>
            </div>
          </div>
        </div>

        <button class="btn btn-info text-dark btn-hub-entrar shadow" onclick="entrarOperacoes()">
          <i class="bi bi-box-arrow-in-right"></i> ACESSAR OPERAÇÕES
        </button>

      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // LANDING SIMPLIFICADA (sem mapa, sem login)
  // Entra direto na lista de operações.
  // Reaproveita inicializarFiltrosOp / getOperacoes / operacoesGlobais do shell.
  // ==========================================
  function entrarOperacoes() {
    if (typeof cobAtivo !== 'undefined') cobAtivo = "GERAL";

    document.getElementById('viewHub').style.display = 'none';
    document.getElementById('viewInterna').style.display = 'none';
    document.getElementById('viewOperacoes').style.display = 'block';

    const titulo = document.getElementById('tituloPainelCob');
    if (titulo) titulo.innerText = 'OPERAÇÕES';

    const grid = document.getElementById('gridCartoes');
    if (grid) grid.innerHTML = '<div class="col-12 text-center text-warning mt-5"><div class="spinner-border" role="status"></div><h5 class="mt-3 text-secondary">Buscando operações...</h5></div>';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(function (listaReal) {
          operacoesGlobais = listaReal || [];
          if (typeof inicializarFiltrosOp === 'function') inicializarFiltrosOp(operacoesGlobais);
        })
        .withFailureHandler(function () {
          if (grid) grid.innerHTML = '<div class="col-12 text-center text-danger mt-5"><h5>Erro ao buscar operações.</h5></div>';
        })
        .getOperacoes();
    } else {
      // Modo local de teste
      operacoesGlobais = [{ id: 1, nome: "OP RESGATE VENEZUELA", cob: "GERAL", municipio: "Caracas", inicio: "01/07/2026 08:00", termino: "-", comandante: "Cmt Incidente", status: "Em Andamento" }];
      if (typeof inicializarFiltrosOp === 'function') inicializarFiltrosOp(operacoesGlobais);
    }
  }

  // Atualiza os contadores da landing assim que todo o shell terminar de carregar.
  window.addEventListener('load', function () {
    if (typeof atualizarContadoresMapa === 'function') {
      try { atualizarContadoresMapa(); } catch (e) {}
    }
  });
</script>
