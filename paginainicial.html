  <script>

   

    let cobAtivo = "";
    let cobTentativa = ""; 
    let operacoesGlobais = []; 

    // Dicionário de Mapas por COB
    const linksMapaPorCob = {
      "1º COB": "https://geoprocessamento.bombeiros.mg.gov.br/portal/apps/experiencebuilder/experience/?id=9c4cc68a45ff4b8cb6f6c4dea2d6985a",
      "2º COB": "https://geoprocessamento.bombeiros.mg.gov.br/portal/apps/experiencebuilder/experience/?id=8e3df9a3937a43b699f8a27eb7548b2b",
      "3º COB": "https://geoprocessamento.bombeiros.mg.gov.br/portal/apps/experiencebuilder/experience/?id=6015911153f3437b963880993425fa3b",
      "4º COB": "https://geoprocessamento.bombeiros.mg.gov.br/portal/apps/experiencebuilder/experience/?id=4a0f59abcc3a4cb9814bc530bddfb6c7",
      "5º COB": "https://geoprocessamento.bombeiros.mg.gov.br/portal/apps/experiencebuilder/experience/?id=ab316f6b0db845e2b28a6504e68c85a0",
      "6º COB": "https://geoprocessamento.bombeiros.mg.gov.br/portal/apps/experiencebuilder/experience/?id=868f9a6e98a04f138707d048a8dc9d15",
      "CEB":    "https://geoprocessamento.bombeiros.mg.gov.br/portal/apps/experiencebuilder/experience/?id=SEU_LINK_CEB" // Caso tenha um mapa geral
    };

    function abrirCob(nomeCob) {
  cobTentativa = nomeCob; 
  const perfilAtual = sessionStorage.getItem("perfilLogado");
  
  if (perfilAtual) {
    if (perfilAtual === "CEB" || perfilAtual === cobTentativa) {
       carregarPainelCob(cobTentativa); 
       return;
    } else {
       Swal.fire({ icon: 'error', title: 'Acesso Bloqueado', text: `Seu usuário (${perfilAtual}) não tem permissão para o ${cobTentativa}.`, background: '#1a1a1a', color: '#fff' });
       return;
    }
  }
  
  document.getElementById('loginMensagemCob').innerText = `ACESSANDO: ${nomeCob}`;
  document.getElementById('loginUsuario').value = "";
  document.getElementById('loginSenha').value = "";
  
  // Puxa o modal de login para a frente
  const modalEl = document.getElementById('modalLogin');
  document.body.appendChild(modalEl);
  
  var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  modal.show();
}

    function fazerLogin() {
      const usuario = document.getElementById('loginUsuario').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();
      const btn = document.getElementById('btnEntrar');

      if(!usuario || !senha) {
        Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Preencha usuário e senha!', background: '#1a1a1a', color: '#fff' });
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Validando...';

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(resposta) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> ENTRAR';
            
            if(resposta.sucesso) {
              sessionStorage.setItem("perfilLogado", resposta.perfil);
              sessionStorage.setItem("usuarioLogado", usuario);
              bootstrap.Modal.getOrCreateInstance(document.getElementById('modalLogin')).hide();
              carregarPainelCob(cobTentativa);
            } else {
              Swal.fire({ icon: 'error', title: 'Acesso Negado', text: resposta.mensagem, background: '#1a1a1a', color: '#fff', confirmButtonColor: '#d33' });
            }
          })
          .withFailureHandler(function(erro) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> ACESSAR';
            Swal.fire({ icon: 'error', title: 'Erro', text: 'Falha de conexão.', background: '#1a1a1a', color: '#fff' });
          })
          .validarLoginGS(usuario, senha, cobTentativa);
      } else {
        // MODO LOCAL
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> ENTRAR';
        sessionStorage.setItem("perfilLogado", cobTentativa);
        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalLogin')).hide();
        carregarPainelCob(cobTentativa);
      }
    }

    function carregarPainelCob(nomeCob) {
      cobAtivo = nomeCob;
      document.getElementById('viewHub').style.display = 'none';
      document.getElementById('viewInterna').style.display = 'none';
      document.getElementById('viewOperacoes').style.display = 'block';
      document.getElementById('tituloPainelCob').innerText = 'OPERAÇÕES ' + cobAtivo;
      document.getElementById('gridCartoes').innerHTML = '<div class="col-12 text-center text-warning mt-5"><div class="spinner-border" role="status"></div><h5 class="mt-3 text-secondary">Buscando operações...</h5></div>';
      
      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function(listaReal) {
            operacoesGlobais = listaReal.filter(op => op.cob === cobAtivo);
            inicializarFiltrosOp(operacoesGlobais);
          })
          .withFailureHandler(function(erro) {
            document.getElementById('gridCartoes').innerHTML = '<div class="col-12 text-center text-danger mt-5"><h5>Erro ao buscar dados.</h5></div>';
          })
          .getOperacoes();
      } else {
        setTimeout(() => {
          operacoesGlobais = [{ id: 1, nome: "OPERAÇÃO TESTE LOCAL", cob: cobAtivo, municipio: "Belo Horizonte", inicio: "19/06/2026 10:00", termino: "-", comandante: "Sgt Local", status: "Em Andamento" }];
          inicializarFiltrosOp(operacoesGlobais);
        }, 1000);
      }
    }

    function voltarAoHub() {

      document.body.classList.replace('fundo-interno', 'fundo-hub');

      document.getElementById('viewOperacoes').style.display = 'none';
      document.getElementById('viewInterna').style.display = 'none';
      document.getElementById('viewHub').style.display = 'block';
      atualizarContadoresMapa();
    }

    function abrirOperacao(id, nome) {
      document.body.classList.replace('fundo-hub', 'fundo-interno');
      const opSelecionada = operacoesGlobais.find(o => String(o.id) === String(id));
      
      // O nome base da operação fica com a cor padrão (branco)
      let tituloHTML = nome; 
      
      if (opSelecionada) {
        let duracao = calcularDuracao(opSelecionada.inicio, opSelecionada.termino, opSelecionada.status);
        
        // Adiciona o DIA em Dourado (text-warning)
        if (duracao) {
          tituloHTML += ` <span class="text-warning">(${duracao})</span>`;
        }
        
        // Adiciona a UC em Azul (text-info) e com a fonte um pouco menor
        if (opSelecionada.uc && opSelecionada.uc.trim() !== '' && opSelecionada.uc !== "Nenhuma / Não se aplica") {
          tituloHTML += ` <span class="text-info" style="font-size: 1rem; font-weight: 600;">- ${opSelecionada.uc}</span>`;
        }
      }

      // ==========================================================

      const iframeGis = document.getElementById('iframeMapaOperacional');

        const linkCorreto = linksMapaPorCob[cobAtivo] || "";

        if (iframeGis.src !== linkCorreto) {
          iframeGis.src = linkCorreto;

      // ==========================================================

      // Oculta as outras telas e mostra a tela interna
      document.getElementById('viewHub').style.display = 'none';
      document.getElementById('viewOperacoes').style.display = 'none';
      document.getElementById('viewInterna').style.display = 'block';
      
      // Usamos innerHTML para que o navegador renderize as cores e tamanhos das tags <span>
      document.getElementById('tituloOperacao').innerHTML = tituloHTML;
      document.getElementById('idOpAtiva').value = id;
      
      window.dispatchEvent(new CustomEvent('operacaoAberta', { detail: { idOp: id } }));

      // SCO é a aba ativa por padrão e só recarregava ao clicar na aba; força o load aqui.
      if (typeof recarregarSCO === 'function') recarregarSCO();
    }

    function voltarParaOperacoes() {

      document.body.classList.replace('fundo-interno', 'fundo-hub');
      abrirCob(cobAtivo);
    }

    function renderizarCartoes(lista) {

      container.innerHTML = ''; 
      if(lista.length === 0) {
        container.innerHTML = '<div class="col-12 text-center text-secondary mt-4"><h5>Nenhuma operação encontrada.</h5></div>';
        return;
      }
      lista.forEach(op => {
        let corBadge = op.status === 'Em Andamento' ? 'bg-success' : 'bg-danger';
        let corBorda = op.status === 'Em Andamento' ? 'border-success' : 'border-danger';
        let textoLocal = op.municipio;
        if (op.uc && op.uc.trim() !== '' && op.uc !== 'Nenhuma / Não se aplica') { textoLocal += ` - ${op.uc}`; }
        
        let duracaoExibicao = op.duracao;
        if (op.status === 'Em Andamento') {
          duracaoExibicao = calcularDuracao(op.inicio, op.termino, op.status);
        }

        let cardHTML = `
          <div class="col-12 col-md-6 col-xl-4">
            <div class="card bg-dark text-light border ${corBorda} h-100 card-op" style="border-width: 2px !important; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
              <div class="card-body">
                <div class="mb-3"><span class="badge ${corBadge} text-uppercase px-2 py-1">${op.status}</span></div>
                <h5 class="card-title fw-bold text-uppercase mb-1">${op.nome}</h5>
                <p class="text-info small mb-3"><i class="bi bi-geo-alt-fill"></i> ${textoLocal}</p>
                <div class="small" style="color: #bbb;">
                  <div class="d-flex justify-content-between border-bottom border-secondary pb-1 mb-1">
                    <span><i class="bi bi-calendar-event"></i> Início:</span> <span class="text-white">${op.inicio}</span>
                  </div>
                  <div class="d-flex justify-content-between border-bottom border-secondary pb-1 mb-1">
                    <span><i class="bi bi-calendar-check"></i> Término:</span> <span class="text-white">${op.termino}</span>
                  </div>
                  <div class="d-flex justify-content-between border-bottom border-secondary pb-1 mb-1">
                    <span><i class="bi bi-clock-history"></i> Duração:</span> <span class="text-warning fw-bold">${duracaoExibicao}</span>
                  </div>
                  <div class="d-flex justify-content-between pt-1 mb-2">
                    <span><i class="bi bi-person-badge"></i> Comandante:</span> <span class="text-warning fw-bold">${op.comandante}</span>
                  </div>
                </div>
                <div class="mt-2 pt-2 border-top border-secondary">
                  <div class="text-secondary small fw-bold mb-1" style="font-size: 0.70rem;">RESUMO RECURSOS:</div>
                  <div class="d-flex justify-content-between text-white small">
                    <span><i class="bi bi-people-fill text-info"></i> EFETIVO: <strong class="fs-6 text-light">${op.efetivo || 0}</strong></span>
                    <span><i class="bi bi-truck text-info"></i> VTRS: <strong class="fs-6 text-light">${op.vtrs || 0}</strong></span>
                  </div>
                </div>
              </div>
              <div class="card-footer bg-transparent border-0 pt-0 d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm flex-grow-0" title="Editar Operação" onclick="abrirModalEditarOp('${op.id}')"><i class="bi bi-pencil-square"></i></button>
                <button class="btn btn-success btn-sm flex-grow-1 fw-bold" onclick="abrirOperacao('${op.id}', '${op.nome}')">Acessar Painel <i class="bi bi-arrow-right-circle ms-1"></i></button>

    let fpFiltroInicio, fpFiltroFim;
    let tomSelectFiltroMunicipio;

    function inicializarFiltrosOp(lista) {
      if (!fpFiltroInicio) {
        fpFiltroInicio = flatpickr("#filtroDataInicio", { locale: "pt", dateFormat: "d/m/Y", onChange: filtrarCards });
        fpFiltroFim = flatpickr("#filtroDataFim", { locale: "pt", dateFormat: "d/m/Y", onChange: filtrarCards });
      }

      const selectMun = document.getElementById('filtroMunicipio');
      selectMun.innerHTML = '<option value="">Todos</option>';
      const municipiosUnicos = [...new Set(lista.map(op => op.municipio).filter(Boolean))].sort();
      municipiosUnicos.forEach(mun => {
        let partes = mun.split(',').map(m => m.trim());
        partes.forEach(p => {
           if(p && !selectMun.querySelector(`option[value="${p}"]`)) {
              let opt = document.createElement('option'); opt.value = p; opt.textContent = p;
              selectMun.appendChild(opt);
           }
        });
      });

      if (tomSelectFiltroMunicipio) tomSelectFiltroMunicipio.destroy();
      tomSelectFiltroMunicipio = new TomSelect("#filtroMunicipio", {
        create: false, sortField: { field: "text", direction: "asc" }, onChange: filtrarCards
      });

      document.getElementById('filtroStatus').addEventListener('change', filtrarCards);
      document.getElementById('filtroChamada').addEventListener('input', filtrarCards);
      document.getElementById('btnLimparFiltros').addEventListener('click', limparFiltrosListagem);

      limparFiltrosListagem(); 
    }

    function filtrarCards() {
      const statusVal = document.getElementById('filtroStatus').value;
      const municipioVal = document.getElementById('filtroMunicipio').value;
      const chamadaVal = document.getElementById('filtroChamada').value.toLowerCase().trim();
      const dataIniVal = document.getElementById('filtroDataInicio').value;
      const dataFimVal = document.getElementById('filtroDataFim').value;

      let filtrados = operacoesGlobais.filter(op => {
        let matchStatus = (statusVal === 'Todas') || (op.status === statusVal);
        let matchMunicipio = !municipioVal || (op.municipio && op.municipio.includes(municipioVal));
        let matchChamada = !chamadaVal || (op.chamada && op.chamada.toLowerCase().includes(chamadaVal));
        
        let matchData = true;
        if (dataIniVal || dataFimVal) {
          if (!op.inicio || op.inicio === "-") {
            matchData = false;
          } else {
            const partesData = op.inicio.split(' ')[0].split('/');
            if (partesData.length === 3) {
                const dataOp = new Date(partesData[2], partesData[1] - 1, partesData[0]);
                if (dataIniVal) {
                  const pIni = dataIniVal.split('/');
                  if (dataOp < new Date(pIni[2], pIni[1] - 1, pIni[0])) matchData = false;
                }
                if (dataFimVal) {
                  const pFim = dataFimVal.split('/');
                  if (dataOp > new Date(pFim[2], pFim[1] - 1, pFim[0])) matchData = false;
                }
            }
          }
        }
        return matchStatus && matchMunicipio && matchChamada && matchData;
      });

      renderizarCartoes(filtrados);
    }

    function limparFiltrosListagem() {
      document.getElementById('filtroStatus').value = "Em Andamento";
      document.getElementById('filtroChamada').value = "";
      if(fpFiltroInicio) fpFiltroInicio.clear();
      if(fpFiltroFim) fpFiltroFim.clear();
      if(tomSelectFiltroMunicipio) tomSelectFiltroMunicipio.setValue("");
      filtrarCards();
    }

    let tomSelectMunicipios = null;
    let tomSelectUC = null;

    function mascaraChamada(obj) {
      let v = obj.value.replace(/\D/g, ''); 
      if (v.length > 13) v = v.substring(0, 13); 
      if (v.length > 12) { v = v.replace(/^(\d{4})(\d{8})(\d{1})/, "$1-$2-$3"); } 
      else if (v.length > 4) { v = v.replace(/^(\d{4})(\d+)/, "$1-$2"); }
      obj.value = v;
    }

    document.addEventListener("DOMContentLoaded", function() {
  // Apenas chamadas de inicialização do servidor
  if (typeof google !== 'undefined' && google.script) {
    google.script.run.withSuccessHandler(preencherMunicipios).getMunicipiosMG();
    google.script.run.withSuccessHandler(preencherUCs).getUCs();
  }
  atualizarContadoresMapa();
});

    function preencherMunicipios(lista) {
      const select = document.getElementById('novaOp_municipio');
      lista.forEach(mun => {
        let opt = document.createElement('option');
        opt.value = mun; opt.text = mun; select.appendChild(opt);
      });
      tomSelectMunicipios = new TomSelect("#novaOp_municipio", { plugins: ['remove_button'], create: false, sortField: { field: "text", direction: "asc" } });
    }

    function preencherUCs(lista) {
      const select = document.getElementById('novaOp_uc');
      lista.forEach(uc => {
        let opt = document.createElement('option');
        opt.value = uc; opt.text = uc; select.appendChild(opt);
      });
      tomSelectUC = new TomSelect("#novaOp_uc", { create: false, sortField: { field: "text", direction: "asc" }, maxItems: 1 });
    }

// 1. ABRIR MODAL NOVA OPERAÇÃO
// ==========================================
function abrirModalNovaOp() {
  document.querySelector('#modalNovaOperacao .modal-title').innerHTML = '<i class="bi bi-plus-circle text-success"></i> Nova Operação';
  document.getElementById('formNovaOperacao').reset();
  document.getElementById('novaOp_id').value = "OP-" + new Date().getTime();
  document.getElementById('novaOp_cob').value = cobAtivo;
  document.getElementById('novaOp_termino').value = "";

  if(tomSelectMunicipios) tomSelectMunicipios.clear();
  if(tomSelectUC) tomSelectUC.clear();

  // 1. Puxa o modal para a frente (Resolve a tela opaca)
  const modalEl = document.getElementById('modalNovaOperacao');
  document.body.appendChild(modalEl); 
  
  // 2. Limpa o calendário velho e cria um novo imune ao bug do Bootstrap
  const inputInicio = document.getElementById('novaOp_inicio');
  if (inputInicio._flatpickr) {
      inputInicio._flatpickr.destroy();
  }
  
  flatpickr(inputInicio, { 
      enableTime: true, 
      dateFormat: "d/m/Y H:i", 
      locale: "pt", 
      time_24hr: true,
      static: true // <--- A MÁGICA: Prende o calendário dentro do modal!
  });

  // 3. Mostra o modal
  var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  modal.show();
}

// ==========================================
// 2. ABRIR MODAL EDITAR OPERAÇÃO
// ==========================================
function abrirModalEditarOp(idOp) {
  const op = operacoesGlobais.find(o => String(o.id) === String(idOp));
  if (!op) return;

  document.querySelector('#modalNovaOperacao .modal-title').innerHTML = '<i class="bi bi-pencil-square text-primary"></i> Editar Operação';
  document.getElementById('novaOp_id').value = op.id; 
  document.getElementById('novaOp_nome').value = op.nome;
  document.getElementById('novaOp_cob').value = op.cob;
  document.getElementById('novaOp_chamada').value = op.chamada;
  document.getElementById('novaOp_cmt').value = op.comandante !== "Não Informado" ? op.comandante : "";
  document.getElementById('novaOp_status').value = op.status;
  document.getElementById('novaOp_termino').value = op.termino !== "-" ? op.termino : "";

  // 1. Puxa o modal para a frente
  const modalEl = document.getElementById('modalNovaOperacao');
  document.body.appendChild(modalEl);

  // 2. Destrói e recria o calendário
  const inputInicio = document.getElementById('novaOp_inicio');
  if (inputInicio._flatpickr) {
      inputInicio._flatpickr.destroy();
  }
  
  flatpickr(inputInicio, { 
      enableTime: true, 
      dateFormat: "d/m/Y H:i", 
      locale: "pt", 
      time_24hr: true,
      static: true // <--- A MÁGICA
  });
  
  // Define a data que veio do banco de dados
  inputInicio._flatpickr.setDate(op.inicio, true, "d/m/Y H:i");

  if (tomSelectMunicipios) {
    tomSelectMunicipios.clear();
    if (op.municipio) {
      let muns = op.municipio.split(',').map(m => m.trim());
      muns.forEach(m => tomSelectMunicipios.addItem(m));
    }
  }

  if (tomSelectUC) {
    tomSelectUC.clear();
    if (op.uc && op.uc !== 'Nenhuma / Não se aplica') { tomSelectUC.addItem(op.uc); }
  }

  // 3. Mostra o modal
  var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  modal.show();
}

    function calcularTermino() {
      const status = document.getElementById('novaOp_status').value;
      const campoTermino = document.getElementById('novaOp_termino');
      if (status === 'Concluída') {
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const ano = agora.getFullYear();
        const hora = String(agora.getHours()).padStart(2, '0');
        const min = String(agora.getMinutes()).padStart(2, '0');
        campoTermino.value = `${dia}/${mes}/${ano} ${hora}:${min}`; 
      } else {
        campoTermino.value = ''; 
      }
    }

    function salvarNovaOperacao() {
      const btnSalvar = document.getElementById('btnSalvarOp');
      const dados = {
          id: document.getElementById('novaOp_id').value,
          nome: document.getElementById('novaOp_nome').value.toUpperCase(),
          cob: document.getElementById('novaOp_cob').value,
          municipios: tomSelectMunicipios ? tomSelectMunicipios.getValue().join(', ') : '',
          chamada: document.getElementById('novaOp_chamada').value,
          cmt: document.getElementById('novaOp_cmt').value.toUpperCase(),
          uc: tomSelectUC ? tomSelectUC.getValue() : '',
          status: document.getElementById('novaOp_status').value,
          inicio: document.getElementById('novaOp_inicio').value,
          termino: document.getElementById('novaOp_termino').value,
          duracao: calcularDuracao(document.getElementById('novaOp_inicio').value, document.getElementById('novaOp_termino').value, document.getElementById('novaOp_status').value)
      };

      if(!dados.nome || !dados.inicio || !dados.municipios) {
          Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Por favor, preencha o Nome, os Municípios e a Data de Início!', background: '#1a1a1a', color: '#fff', confirmButtonColor: '#ff9800' });
          return;
      }

      btnSalvar.disabled = true;
      btnSalvar.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Gravando...';

      if (typeof google !== 'undefined' && google.script) {
          google.script.run.withSuccessHandler(() => {
              btnSalvar.disabled = false;
              btnSalvar.innerHTML = '<i class="bi bi-save"></i> Gravar Operação';
              bootstrap.Modal.getOrCreateInstance(document.getElementById('modalNovaOperacao')).hide();
              Swal.fire({ icon: 'success', title: 'Sucesso', text: 'Operação salva com sucesso.', background: '#1a1a1a', color: '#fff', showConfirmButton: false, timer: 2000 });
              abrirCob(cobAtivo);
          }).salvarOperacaoPlanilha(dados);
      }
    }

    function calcularDuracao(inicioStr, terminoStr, status) {
      if (!inicioStr) return "";
      const parseData = (str) => {
        if (!str || str === "-") return new Date();
        const partes = str.split(" ")[0].split("/");
        return new Date(partes[2], partes[1] - 1, partes[0]);
      };
      const dInicio = parseData(inicioStr);
      dInicio.setHours(0, 0, 0, 0); 
      let dFim = new Date();
      dFim.setHours(0, 0, 0, 0);
      if (status === 'Concluída' && terminoStr && terminoStr !== "-") {
        dFim = parseData(terminoStr);
        dFim.setHours(0, 0, 0, 0);
      }
      const diffTempo = dFim.getTime() - dInicio.getTime();
      const diffDias = Math.floor(diffTempo / (1000 * 3600 * 24));
      return "DIA " + (diffDias >= 0 ? diffDias + 1 : 1);
    }

    let todasOperacoesHub = []; // Variável global para guardar os dados do mapa instantaneamente

    // 1. A LÓGICA DO MAPA INTERATIVO (HOVER E PANORAMA GERAL)
function atualizarContadoresMapa() {
  if (typeof google !== 'undefined' && google.script) {
    google.script.run.withSuccessHandler(function(listaReal) {
      todasOperacoesHub = listaReal; // Salva silenciosamente para o hover funcionar rápido
      
      // ===============================================
      // NOVO: CALCULA O PANORAMA GERAL DO ESTADO
      // ===============================================
      let totalAndamento = 0;
      let totalConcluidas = 0;
      
      listaReal.forEach(op => {
        if (op.status === 'Em Andamento') {
          totalAndamento++;
        } else if (op.status === 'Concluída') {
          totalConcluidas++;
        }
      });
      
      // Injeta os totais no painel fixo
      const elAndamento = document.getElementById('globalAndamento');
      const elConcluidas = document.getElementById('globalConcluidas');
      
      if (elAndamento) elAndamento.innerText = totalAndamento;
      if (elConcluidas) elConcluidas.innerText = totalConcluidas;
      
    }).getOperacoes();
  }
}

    // 2. Função disparada ao PASSAR O MOUSE sobre o COB
    function mostrarResumoCob(nomeCob) {
      const painel = document.getElementById('painelHoverCob');
      const placeholder = document.getElementById('painelHoverPlaceholder');
      
      // Filtra as operações que pertencem a esse COB
      const opsCob = todasOperacoesHub.filter(op => op.cob === nomeCob);
      
      let countAndamento = 0;
      let countConcluidas = 0;
      let listaHTML = '';

      opsCob.forEach(op => {
        if(op.status === 'Em Andamento') {
            countAndamento++;
            // Calcula qual dia é (DIA 1, DIA 2...)
            let duracao = calcularDuracao(op.inicio, op.termino, op.status);
            
            // Trata a Unidade de Conservação
            let ucTexto = (op.uc && op.uc.trim() !== '' && op.uc !== 'Nenhuma / Não se aplica') ? ` - <span class="text-secondary">${op.uc}</span>` : '';
            
            // Monta a linha
            listaHTML += `
              <li class="mb-3 pb-2 border-bottom border-dark">
                <span class="text-warning fw-bold d-block mb-1"><i class="bi bi-fire text-danger"></i> ${op.nome} (${duracao})</span>
                <span class="text-light small" style="font-size: 0.8rem;">${ucTexto.replace(' - ', '')}</span>
              </li>`;
        } else if (op.status === 'Concluída') {
            countConcluidas++;
        }
      });

      // Se não tiver nada em andamento
      if (countAndamento === 0) {
          listaHTML = '<li class="text-secondary small fst-italic">Nenhuma operação ativa no momento.</li>';
      }

      // Preenche os dados no HTML
      document.getElementById('hoverNomeCob').innerText = nomeCob;
      document.getElementById('hoverAndamento').innerText = countAndamento;
      document.getElementById('hoverConcluidas').innerText = countConcluidas;
      document.getElementById('hoverListaOps').innerHTML = listaHTML;

      // Troca os painéis
      placeholder.style.display = 'none';
      painel.style.display = 'flex'; // Usando flex para manter o h-100
    }
